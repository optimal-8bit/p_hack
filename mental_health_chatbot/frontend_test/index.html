<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Chatbot - Test UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #16213e;
            padding: 20px;
            border-bottom: 2px solid #0f3460;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .session-info {
            font-size: 12px;
            color: #aaa;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #16213e;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            text-align: right;
        }

        .message-content {
            display: inline-block;
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 10px;
            text-align: left;
        }

        .message.user .message-content {
            background: #0f3460;
        }

        .message.bot .message-content {
            background: #533483;
        }

        .message.bot.crisis .message-content {
            background: #c0392b;
            border: 2px solid #e74c3c;
        }

        .crisis-badge {
            display: inline-block;
            background: #e74c3c;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .metadata {
            font-size: 11px;
            color: #aaa;
            margin-top: 8px;
            font-family: 'Courier New', monospace;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #16213e;
            color: #eee;
            font-size: 14px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            background: #0f3460;
            color: #eee;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        button:hover {
            background: #533483;
        }

        button:disabled {
            background: #333;
            cursor: not-allowed;
        }

        .sidebar {
            width: 300px;
            background: #16213e;
            padding: 20px;
            overflow-y: auto;
            border-left: 2px solid #0f3460;
        }

        .sidebar h2 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #0f3460;
        }

        .health-status {
            background: #1a1a2e;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .health-item {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 12px;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .status-indicator.healthy {
            background: #27ae60;
        }

        .status-indicator.unhealthy {
            background: #e74c3c;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #333;
            border-top-color: #0f3460;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .controls {
            margin-top: 20px;
        }

        .controls button {
            width: 100%;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧠 Mental Health Chatbot</h1>
        <div class="session-info">
            Session ID: <span id="sessionId">Loading...</span>
        </div>
    </div>

    <div class="main-container">
        <div class="chat-container">
            <div class="chat-window" id="chatWindow">
                <div class="message bot">
                    <div class="message-content">
                        Hello! I'm here to listen and support you. How are you feeling today?
                    </div>
                </div>
            </div>

            <div class="input-container">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Type your message here..."
                    autocomplete="off"
                >
                <button id="sendButton">Send</button>
            </div>
        </div>

        <div class="sidebar">
            <h2>System Health</h2>
            <div class="health-status" id="healthStatus">
                <div class="loading"></div> Loading...
            </div>

            <div class="controls">
                <button id="clearButton">Clear Session</button>
                <button id="refreshHealthButton">Refresh Health</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
